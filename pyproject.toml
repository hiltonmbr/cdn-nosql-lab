[project]
name = "cdn-docker-nosql"
version = "1.0.0"
description = "Guia prático e notebooks interativos para explorar bancos de dados NoSQL com Docker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jupyterlab>=4.0.0",
    "nbclassic>=1.0.0",
    "notebook>=7.0.0",
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "cassandra-driver>=3.29.0",
    "neo4j>=5.16.0",
    "psycopg[binary]>=3.1.0",
]

[tool.uv]
managed = true
