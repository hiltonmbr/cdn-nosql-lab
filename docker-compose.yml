services:
  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  mongo:
    container_name: mongo
    image: mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data
    restart: unless-stopped

  cassandra:
    container_name: cassandra
    image: cassandra:5.0.8-bookworm
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/data
    environment:
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
    restart: unless-stopped

  neo4j:
    container_name: neo4j
    image: neo4j:5.26.26-community-ubi10
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
  cassandra_data:
  neo4j_data: